name: Emploi du temps

on:
  schedule:
    - cron: "17 4-21/2 * * *"   # toutes les 2 h en journée (heure UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edt
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger le calendrier ICS
        run: |
          URL=$(python3 -c "import json;print(json.load(open('config/edt.json')).get('icsUrl',''))" 2>/dev/null || true)
          if [ -z "$URL" ]; then echo "Pas de lien ICS dans config/edt.json"; exit 0; fi
          curl -fsSL --retry 3 --max-time 60 -A "Mozilla/5.0 (Mon ENSAM)" "$URL" -o edt.new.ics
          grep -q "BEGIN:VCALENDAR" edt.new.ics || { echo "Le lien ne renvoie pas un calendrier ICS"; exit 1; }

      - name: Enregistrer si l'emploi du temps a changé
        run: |
          [ -f edt.new.ics ] || exit 0
          strip() { grep -v -E '^(DTSTAMP|LAST-MODIFIED|SEQUENCE|CREATED)' "$1" 2>/dev/null || true; }
          if [ -f edt.ics ] && [ "$(strip edt.ics)" = "$(strip edt.new.ics)" ]; then echo "Pas de changement"; rm edt.new.ics; exit 0; fi
          mv edt.new.ics edt.ics
          git config user.name "edt-bot"
          git config user.email "edt-bot@users.noreply.github.com"
          git add edt.ics
          git commit -m "Emploi du temps mis à jour"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
